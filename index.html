<style>
/* Layout: 멤버십 클럽 무드. 히어로에 실물 같은 회원카드, 이후 섹션은 넓은 여백 + 벤토 카드 + 티켓형 멤버십. */
:root {
  --bg: #FFF8EE;
  --paper: #FFFCF7;
  --ink: #2B2420;
  --ink-2: #5E5248;
  --ink-3: #9A8B7C;
  --line: #F0E2CF;
  --green: #D2733F;        /* 포인트: 해 뜨는 주황 (배경·버튼) */
  --accent-ink: #A85A30;   /* 포인트 글자용 진한 주황 */
  --green-soft: #F5E4D5;
  --sprout: #5E9E2F;       /* 보조: 새싹 연두 */
  --sprout-soft: #E6F2D8;
  --on-dark: #FFF4E8;
  --on-dark-2: #CDB9A6;
  --dark: #3A2E26;
  --dark-line: #54453A;
  --kr: "Pretendard Variable", Pretendard, "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --en: "Hanken Grotesk", "Pretendard Variable", Pretendard, -apple-system, sans-serif;
  --r-lg: 28px;
  --r-md: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18130F; --paper: #221B16; --ink: #F5ECE2; --ink-2: #C7B8A9; --ink-3: #93847A; --line: #33291F;
    --green: #C97A4E; --accent-ink: #E5A47E; --green-soft: #33241A; --sprout: #9BD06A; --sprout-soft: #22301A;
    --on-dark: #F5ECE2; --on-dark-2: #B5A595; --dark: #2C221B; --dark-line: #46382D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18130F; --paper: #221B16; --ink: #F5ECE2; --ink-2: #C7B8A9; --ink-3: #93847A; --line: #33291F;
  --green: #C97A4E; --accent-ink: #E5A47E; --green-soft: #33241A; --sprout: #9BD06A; --sprout-soft: #22301A;
  --on-dark: #F5ECE2; --on-dark-2: #B5A595; --dark: #2C221B; --dark-line: #46382D;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--kr); font-size: 17px; line-height: 1.7; letter-spacing: -0.015em;
  word-break: keep-all; -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; font-weight: 700; }
p { text-wrap: pretty; }
ul { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }

.wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.en { font-family: var(--en); letter-spacing: 0; }

/* ---------- Header ---------- */
.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; padding-block: 14px; }
.header-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  height: 60px; padding: 0 10px 0 22px; border-radius: 999px;
  background: color-mix(in srgb, var(--paper) 82%, transparent);
  border: 1px solid var(--line);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--en); font-weight: 700; font-size: 17px; letter-spacing: 0.02em; }
.logo-mark { width: 22px; height: 22px; flex: none; }
.logo-short { display: none; }
@media (max-width: 680px) { .logo-full { display: none; } .logo-short { display: inline; } }
.nav { display: flex; gap: 30px; font-size: 15px; color: var(--ink-2); }
.nav a { text-decoration: none; }
.nav a:hover { color: var(--ink); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  height: 56px; padding: 0 12px 0 28px; border-radius: 999px; border: 0;
  background: var(--ink); color: var(--bg);
  font: inherit; font-weight: 600; font-size: 16px; text-decoration: none; cursor: pointer;
  transition: transform .2s ease;
}
.btn-arrow {
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
  background: var(--bg); color: var(--ink); font-size: 15px;
}
.btn:hover { transform: translateY(-2px); }
.btn--sm { height: 42px; padding: 0 20px; font-size: 14px; }
.btn--light { background: var(--on-dark); color: var(--dark); }
.btn--light .btn-arrow { background: var(--dark); color: var(--on-dark); }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }

/* ---------- Section head ---------- */
.section { padding-block: clamp(80px, 11vw, 150px); }
.head { display: grid; gap: 18px; margin-bottom: clamp(40px, 6vw, 64px); max-width: 720px; }
.label {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--en); font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3);
}
.label::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.title { font-size: clamp(30px, 4.4vw, 50px); line-height: 1.22; letter-spacing: -0.045em; }
.lead { color: var(--ink-2); font-size: clamp(16px, 1.6vw, 18px); max-width: 36em; }

/* ---------- Hero ---------- */
.hero { padding-block: clamp(40px, 7vw, 96px) clamp(72px, 10vw, 128px); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: clamp(40px, 6vw, 80px); align-items: center; }
.hero-kicker { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink-2); }
.hero h1 { margin-top: 22px; font-family: var(--en); font-weight: 700; font-size: clamp(44px, 6.6vw, 92px); line-height: 1; letter-spacing: -0.045em; }
.hero-sub em { font-style: normal; color: var(--accent-ink); }
.hero-sub { margin-top: 22px; font-size: clamp(20px, 2.3vw, 26px); font-weight: 600; letter-spacing: -0.04em; }
.hero-slogan { margin-top: 12px; color: var(--ink-2); font-size: clamp(16px, 1.6vw, 18px); max-width: 26em; }
.hero-actions { margin-top: 40px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }
.hero-note { font-size: 15px; color: var(--ink-2); }
.hero-note b { color: var(--accent-ink); font-weight: 700; }

/* membership card object */
.card-stage { position: relative; display: grid; place-items: center; padding: 24px 0; min-width: 0; }
.card-stage::before {
  content: ""; position: absolute; inset: 6% 2% 6% 10%;
  border-radius: 40px; background: var(--sprout-soft);
}
.mcard {
  position: relative; width: min(100%, 440px); aspect-ratio: 1.586; max-width: 100%;
  border-radius: 22px; padding: clamp(20px, 3vw, 28px);
  background: radial-gradient(120% 140% at 0% 0%, #34322D 0%, #1B1A17 60%);
  color: #F4EFE6;
  box-shadow: 0 40px 60px -30px rgba(30, 29, 26, .55), 0 2px 0 rgba(255,255,255,.06) inset;
  transform: rotate(-5deg);
  display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
}
.mcard-net { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; pointer-events: none; }
.mcard-top, .mcard-bottom { position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.mcard-brand { font-family: var(--en); font-weight: 700; font-size: clamp(18px, 2.2vw, 22px); letter-spacing: 0.02em; }
.mcard-brand small { display: block; font-family: var(--kr); font-weight: 500; font-size: 12px; letter-spacing: 0.04em; color: #A9A397; margin-top: 2px; }
.mcard-chip { width: 40px; height: 30px; border-radius: 6px; background: linear-gradient(135deg, #C9BC9C, #8E8366); }
.mcard-name { font-size: clamp(15px, 1.8vw, 17px); color: #D9D3C7; }
.mcard-meta { font-family: var(--en); font-size: 11px; letter-spacing: 0.14em; color: #A9A397; text-align: right; line-height: 1.6; }
.mcard-meta b { display: block; font-size: 15px; color: #F4EFE6; letter-spacing: 0.04em; font-weight: 600; }

/* hero host */
.host { display: flex; align-items: center; gap: 12px; }
.host img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; object-position: 50% 12%; border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line); }
.host p { font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.host b { display: block; color: var(--ink); font-size: 15px; font-weight: 600; }
.hero-badge { display: inline-flex; align-items: center; gap: 8px; margin-left: 12px; padding: 4px 12px; border-radius: 999px; background: var(--sprout-soft); color: var(--sprout); font-family: var(--kr); font-size: 13px; font-weight: 600; letter-spacing: -0.01em; text-transform: none; vertical-align: middle; }

/* ---------- Leader ---------- */
.leader { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: clamp(32px, 6vw, 80px); align-items: start; }
.leader-photo { position: relative; margin: 0; border-radius: var(--r-lg); overflow: hidden; background: var(--paper); aspect-ratio: 4 / 5; max-width: 100%; }
.leader-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 8%; display: block; }
.leader-photo figcaption {
  position: absolute; left: 16px; bottom: 16px; padding: 8px 14px; border-radius: 999px;
  background: rgba(58, 46, 38, .82); color: #FFF4E8; font-size: 13px; font-weight: 600;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.leader-body { display: grid; gap: 28px; min-width: 0; padding-top: 8px; }
.leader-role { font-size: 15px; font-weight: 600; color: var(--accent-ink); }
.leader-name { font-size: clamp(56px, 8vw, 104px); line-height: 1; letter-spacing: -0.065em; margin-top: 10px; }
.leader-tagline { font-size: clamp(20px, 2.2vw, 26px); font-weight: 600; line-height: 1.45; letter-spacing: -0.04em; max-width: 20em; }
.leader-bio { display: grid; gap: 14px; color: var(--ink-2); max-width: 36em; }

.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: clamp(48px, 7vw, 80px); border-top: 2px solid var(--ink); }
.stat { padding: 22px 18px 0 0; display: grid; gap: 8px; align-content: start; }
.stat + .stat { padding-left: 18px; border-left: 1px solid var(--line); }
.stat-v { font-family: var(--en); font-size: clamp(34px, 3.6vw, 48px); font-weight: 600; line-height: 1; letter-spacing: -0.04em; white-space: nowrap; }
.stat-v small { font-family: var(--kr); font-size: .45em; font-weight: 600; margin-left: 2px; letter-spacing: -0.02em; }
.stat-k { font-size: 14px; color: var(--ink-2); line-height: 1.5; }

.leader-more { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 14px; margin-top: clamp(40px, 6vw, 64px); }
.quote { background: var(--dark); color: var(--on-dark); border-radius: var(--r-md); padding: clamp(28px, 3.6vw, 40px); display: grid; gap: 28px; align-content: space-between; }
.quote p { font-size: clamp(21px, 2.3vw, 27px); font-weight: 600; line-height: 1.5; letter-spacing: -0.04em; }
.quote em { font-style: normal; color: #E9B18C; }
.quote cite { font-style: normal; font-size: 14px; color: var(--on-dark-2); }
.career { background: var(--paper); border-radius: var(--r-md); padding: clamp(28px, 3.6vw, 40px); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 32px; }
.career h3 { font-family: var(--en); font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
.career li { padding-block: 10px; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.5; }
.career li b { font-weight: 600; }
.career li span { display: block; color: var(--ink-3); font-size: 13px; margin-top: 2px; }

/* ---------- About ---------- */
.about { background: var(--paper); border-radius: var(--r-lg); padding: clamp(36px, 6vw, 80px); display: grid; gap: clamp(40px, 6vw, 64px); }
.about-statement { font-size: clamp(24px, 3.3vw, 40px); font-weight: 600; line-height: 1.45; letter-spacing: -0.045em; max-width: 22em; }
.about-statement em { font-style: normal; color: var(--accent-ink); }
.about-foot { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 32px; align-items: end; padding-top: 32px; border-top: 1px solid var(--line); }
.about-years { display: flex; align-items: flex-end; gap: 14px; }
.about-years strong { font-family: var(--en); font-weight: 600; font-size: clamp(72px, 9vw, 112px); line-height: .85; letter-spacing: -0.05em; }
.about-years span { color: var(--ink-2); font-size: 15px; line-height: 1.5; padding-bottom: 6px; }
.about-body { color: var(--ink-2); max-width: 34em; }

/* ---------- Fields band ---------- */
.fields { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; font-size: clamp(30px, 5.6vw, 72px); font-weight: 700; letter-spacing: -0.05em; line-height: 1.3; }
.fields li { display: inline-flex; align-items: center; }
.fields li:nth-child(even) { color: var(--ink-3); }
.fields li:not(:last-child)::after { content: ""; width: .18em; height: .18em; border-radius: 50%; background: var(--sprout); margin: 0 .38em; }

/* ---------- Benefits ---------- */
.benefits { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.benefit {
  background: var(--paper); border-radius: var(--r-md); padding: 30px 28px 32px;
  display: grid; gap: 40px; align-content: space-between; min-height: 220px;
}
.benefit-icon { width: 48px; height: 48px; border-radius: 14px; background: var(--bg); display: grid; place-items: center; color: var(--accent-ink); }
.benefit-icon svg { width: 24px; height: 24px; }
.benefit h3 { font-size: 19px; line-height: 1.45; letter-spacing: -0.035em; font-weight: 600; }
.benefit-desc { margin-top: 10px; color: var(--ink-2); font-size: 15px; line-height: 1.6; }
.benefit--feature .benefit-desc { color: color-mix(in srgb, var(--paper) 85%, transparent); }
.benefit-tag { display: block; font-size: 13px; color: var(--ink-3); margin-bottom: 6px; font-weight: 500; }
.benefit--feature { background: var(--green); color: var(--paper); }
.benefit--feature .benefit-icon { background: color-mix(in srgb, var(--paper) 14%, transparent); color: var(--paper); }
.benefit--feature .benefit-tag { color: color-mix(in srgb, var(--paper) 70%, transparent); }

/* ---------- Programs (bento) ---------- */
.bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.prog { background: var(--paper); border-radius: var(--r-md); padding: 26px; display: grid; gap: 28px; align-content: space-between; min-width: 0; min-height: 210px; }
.prog-status { justify-self: start; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: var(--bg); color: var(--ink-3); }
.prog h3 { font-size: 19px; letter-spacing: -0.035em; font-weight: 600; line-height: 1.4; }
.prog p { color: var(--ink-2); font-size: 15px; margin-top: 6px; line-height: 1.6; }
.prog--main {
  grid-column: span 2; grid-row: span 2;
  background: var(--dark); color: var(--on-dark); padding: clamp(28px, 3.6vw, 40px);
}
.prog--main .prog-status { background: var(--green); color: #fff; }
.prog--main h3 { font-size: clamp(26px, 3vw, 36px); font-weight: 700; letter-spacing: -0.05em; line-height: 1.25; }
.prog--main p { color: var(--on-dark-2); font-size: 17px; margin-top: 12px; max-width: 22em; }
.price { display: grid; gap: 14px; padding-top: 24px; border-top: 1px solid var(--dark-line); font-variant-numeric: tabular-nums; }
.price-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.price-k { font-size: 15px; color: var(--on-dark-2); }
.price-old { font-family: var(--en); font-size: 18px; color: var(--on-dark-2); text-decoration: line-through; }
.price-new { font-family: var(--en); font-size: clamp(36px, 4vw, 48px); font-weight: 600; letter-spacing: -0.04em; line-height: 1; }
.price-new small { font-family: var(--kr); font-size: 18px; font-weight: 600; margin-left: 2px; }
.price-save { justify-self: end; font-size: 13px; font-weight: 600; color: var(--dark); background: var(--on-dark); padding: 5px 12px; border-radius: 999px; }

.topics { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 24px; border-top: 1px solid var(--dark-line); }
.topics-k { width: 100%; font-size: 13px; color: var(--on-dark-2); margin-bottom: 4px; }
.topic { padding: 8px 15px; border-radius: 999px; border: 1px solid var(--dark-line); font-size: 14px; font-weight: 500; }
.prog-en { font-family: var(--en); letter-spacing: 0.02em; }

/* ---------- Criteria (keys + principles) ---------- */
.keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.key { background: var(--paper); border-radius: var(--r-md); padding: 28px 26px 30px; display: grid; gap: 40px; align-content: space-between; min-height: 240px; min-width: 0; }
.key-en { font-family: var(--en); font-size: clamp(26px, 2.6vw, 32px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; color: var(--accent-ink); }
.key h3 { font-size: 19px; font-weight: 600; letter-spacing: -0.035em; }
.key p { color: var(--ink-2); font-size: 15px; line-height: 1.6; margin-top: 6px; min-height: 3.2em; }
.prog:not(.prog--main) p { min-height: 3.2em; }
.rules { margin-top: 14px; background: var(--dark); color: var(--on-dark); border-radius: var(--r-md); padding: clamp(28px, 4vw, 44px); display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 32px; align-items: start; }
.rules .label { color: var(--on-dark-2); }
.rules h3 { font-size: clamp(22px, 2.4vw, 28px); letter-spacing: -0.045em; margin-top: 14px; line-height: 1.35; }
.rules li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 14px; align-items: start; padding-block: 16px; border-top: 1px solid var(--dark-line); font-size: 17px; font-weight: 500; }
.rules li:first-child { border-top: 0; padding-top: 0; }
.rules li:last-child { padding-bottom: 0; }
.rules .crit-mark { border: 1px solid var(--on-dark-2); color: var(--on-dark-2); }

/* ---------- Participation ---------- */
.criteria { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.crit { border-radius: var(--r-md); padding: clamp(28px, 3.6vw, 40px); display: grid; gap: 24px; align-content: start; }
.crit--yes { background: var(--paper); }
.crit--no { border: 1px solid var(--line); }
.crit h3 { font-size: 21px; letter-spacing: -0.04em; }
.crit ul { display: grid; }
.crit li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; align-items: start; padding-block: 16px; border-top: 1px solid var(--line); }
.crit li:last-child { padding-bottom: 0; }
.crit-mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }

  const cv = $("#net");
  function drawNet() {
    const r = cv.getBoundingClientRect(); if (!r.width) return;
    const dpr = window.devicePixelRatio || 1;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const pts = Array.from({ length: 22 }, () => ({ x: r.width * (0.35 + rnd() * 0.65), y: r.height * rnd() }));
    ctx.strokeStyle = "rgba(244,239,230,.16)"; ctx.lineWidth = 1;
    pts.forEach((a, i) => pts.slice(i + 1).forEach((b) => { if (Math.hypot(a.x - b.x, a.y - b.y) < r.width * 0.22) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); } }));
